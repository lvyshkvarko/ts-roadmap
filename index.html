<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Роадмап TechSupport (Jira)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0e1113; --bar:#14181b; --card:#181d21; --card2:#1f252a; --line:#283037; --fg:#eef1f3; --muted:#8f98a0; --faint:#5f6870;
  --green:#34c759; --accent:#34c759; --ochre:#e0a83a;
  --c-done:#34c759; --c-wip:#f2a516; --c-review:#3d8bfd; --c-blocked:#ef4a3f; --c-todo:#7c8cff; --c-est:#a77bf3; --c-idea:#6b7680; --c-here:#ff7a3d;
  --sans:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button,select,input{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;padding:0}
.wrap{max-width:1180px;margin:0 auto;padding:0 28px 80px}
.narrow{max-width:900px}

/* bar */
.bar{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bar) 94%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar-in{max-width:1180px;margin:0 auto;padding:0 28px;height:70px;display:flex;align-items:center;gap:16px}
.ib{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex:none}
.ib:hover{background:var(--card)}
.ib svg{width:25px;height:25px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.bar h1{font-size:22px;font-weight:700;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.01em}
.bar .sync{font-size:14px;color:var(--muted);display:flex;align-items:center;gap:8px;white-space:nowrap}
.bar .sync button{color:var(--accent);font-weight:600}

/* home */
.home{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:36px;margin-top:34px}
.home>*{min-width:0}
.hello{font-size:34px;line-height:1.15;font-weight:800;letter-spacing:-.025em;margin:0}
.lead{color:var(--muted);margin:10px 0 26px;font-size:16.5px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:22px 18px}
.tile{display:flex;flex-direction:column;align-items:center;gap:10px;cursor:pointer}
.tile .sq{width:100%;aspect-ratio:1/1;max-width:150px;border-radius:28px;display:grid;place-items:center;position:relative;transition:transform .15s,box-shadow .15s}
.tile:hover .sq{transform:translateY(-3px);box-shadow:0 10px 30px rgba(0,0,0,.35)}
.tile svg{width:46px;height:46px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.tile .lbl{font-size:12.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;text-align:center}
.tile .cnt{font-size:14px;color:var(--muted);margin-top:-6px}
.tile .badge{position:absolute;top:11px;right:13px;min-width:24px;height:24px;padding:0 7px;border-radius:12px;background:rgba(0,0,0,.3);font-size:13px;font-weight:700;display:grid;place-items:center}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:30px 0 8px}
.stat{background:var(--card);border:1px solid transparent;border-radius:16px;padding:14px 16px;cursor:pointer;text-align:left;transition:border-color .15s,background .15s}
.stat:hover{border-color:var(--line);background:var(--card2)}
.stat b{display:block;font-size:28px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.stat span{font-size:14px;color:var(--muted);display:flex;align-items:center;gap:7px;margin-top:4px;white-space:nowrap}
.stat i{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.block{margin-top:34px}
.bh{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px}
.bh h3{font-size:20px;font-weight:700;margin:0;letter-spacing:-.01em}
.bh h3 small{color:var(--faint);font-weight:500;margin-left:6px;font-size:16px}
.bh a,.bh button{color:var(--accent);font-weight:600;font-size:15px}
.side{display:flex;flex-direction:column;gap:18px}
.panel{background:var(--card);border-radius:20px;padding:20px 20px 16px}
.panel h4{margin:0 0 14px;font-size:17px;font-weight:700}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.kv button{background:var(--card2);border-radius:14px;padding:12px 14px;text-align:left}
.kv button:hover{outline:1px solid var(--line)}
.kv b{display:block;font-size:26px;font-weight:800;color:var(--green);line-height:1.1}
.kv span{font-size:13.5px;color:var(--muted)}
.mbar{display:grid;grid-template-columns:78px 1fr 30px;gap:10px;align-items:center;padding:5px 6px;border-radius:9px;cursor:pointer;font-size:14px}
.mbar:hover{background:var(--card2)}
.mbar .l{color:var(--muted)}
.mbar .t{height:10px;border-radius:6px;background:var(--card2);overflow:hidden}
.mbar .t i{display:block;height:100%;background:var(--green);border-radius:6px}
.mbar .n{text-align:right;font-weight:700}
.cmt{padding:10px 6px;border-top:1px solid var(--line);cursor:pointer}
.cmt:first-of-type{border-top:0}
.cmt:hover{background:var(--card2);border-radius:10px}
.cmt .h{font-size:13px;color:var(--muted)}
.cmt .h b{color:var(--fg);font-weight:600}
.cmt .x{font-size:14.5px;margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cmt .k{font-size:13px;color:var(--accent);margin-top:3px}

/* compact rows */
.rows{display:flex;flex-direction:column;gap:8px}
.lr{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;background:var(--card);border-radius:14px;padding:13px 16px;cursor:pointer;border:1px solid transparent}
.lr:hover{border-color:var(--line);background:var(--card2)}
.lr>.pill{min-width:128px;text-align:center}
.lr .m{min-width:0}
.lr .tt{font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lr .sub{font-size:13.5px;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap;margin-top:2px}
.lr .r{font-size:13.5px;color:var(--muted);text-align:right;white-space:nowrap}
.lr .r b{display:block;color:var(--fg);font-weight:600}
.ic{display:inline-flex;align-items:center;gap:4px}
.ic svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* category */
.hero{display:flex;gap:18px;align-items:center;margin:30px 0 0}
.hero .sq{width:62px;height:62px;border-radius:18px;display:grid;place-items:center;flex:none}
.hero svg{width:31px;height:31px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.hero h2{font-size:30px;font-weight:800;letter-spacing:-.02em;margin:0;line-height:1.2}
.hero p{margin:4px 0 0;color:var(--muted);font-size:15.5px}
.prog{margin:22px 0 8px;height:6px;background:var(--card2);border-radius:6px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--green);border-radius:6px}
.progt{font-size:15px;color:var(--muted)}
.tools{margin:26px 0 8px;display:flex;flex-direction:column;gap:12px}
.trow{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.search{flex:1;min-width:220px;position:relative}
.search input{width:100%;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px 12px 44px;font-size:16px;outline:none;color:var(--fg)}
.search input:focus{border-color:var(--accent)}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:20px;height:20px;stroke:var(--muted);fill:none;stroke-width:2}
.seg{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px}
.seg button{padding:8px 14px;border-radius:10px;font-size:15px;font-weight:600;color:var(--muted);display:inline-flex;gap:7px;align-items:center}
.seg button.on{background:var(--card2);color:var(--fg)}
.seg svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.sel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 14px;font-size:15px;color:var(--fg);outline:none;cursor:pointer}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1.5px solid var(--line);border-radius:999px;padding:7px 15px;font-size:15px;font-weight:600;color:var(--muted);display:inline-flex;gap:8px;align-items:center}
.chip:hover{color:var(--fg)}
.chip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip i{width:9px;height:9px;border-radius:50%}
.chip em{font-style:normal;opacity:.6;font-weight:500}
.fnote{font-size:14px;color:var(--muted);display:flex;gap:10px;align-items:center}
.fnote button{color:var(--accent);font-weight:600}

/* timeline */
.tl{position:relative;margin-top:28px}
.tl::before{content:"";position:absolute;left:111px;top:0;bottom:0;width:2px;background:var(--line)}
.row{display:grid;grid-template-columns:90px 44px 1fr;position:relative}
.sec{margin:38px 0 16px}
.sec:first-child{margin-top:4px}
.sec .t{grid-column:3;font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding-left:20px}
.sec .n{color:var(--faint);margin-left:8px;letter-spacing:0}
.mo{margin:24px 0 12px}
.mo span{grid-column:3;padding-left:20px;font-size:18px;font-weight:700;color:var(--muted)}
.it{margin-bottom:20px;cursor:pointer}
.it .d{padding-top:16px}
.it .d b{display:block;font-size:32px;line-height:1;font-weight:800;letter-spacing:-.02em}
.it .d span{display:block;font-size:19px;color:var(--muted);margin-top:4px}
.it .d small{display:block;font-size:12px;color:var(--faint);margin-top:4px}
.it .d small.pre{margin:0 0 5px;font-size:12.5px;color:var(--muted);white-space:nowrap}
.it .d:has(small.pre){padding-top:2px}
.it .p{justify-self:center;margin-top:20px;width:24px;height:24px;border-radius:50%;background:var(--bg);border:6px solid var(--c);position:relative;z-index:1}
.it .p.hollow{border-width:3px}
.cd{margin-left:20px;background:var(--card);border:1px solid transparent;border-radius:16px;padding:20px 22px;transition:border-color .15s,background .15s;min-width:0}
.it:hover .cd{border-color:var(--line);background:var(--card2)}
.cd .top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.pill{display:inline-block;padding:5px 12px;border-radius:9px;font-size:14px;font-weight:700;color:#fff;background:var(--c);white-space:nowrap}
.pill.done{color:#06200f}
.key{font-size:14px;color:var(--muted);font-weight:600;white-space:nowrap}
.key:hover{color:var(--accent)}
.cd .ti{font-size:20px;font-weight:700;line-height:1.3;margin-top:13px;letter-spacing:-.01em}
.cd .ds{color:var(--muted);font-size:15px;margin-top:7px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.note{margin-top:12px;font-size:14.5px;display:flex;gap:9px;align-items:flex-start;color:var(--muted)}
.note svg{width:17px;height:17px;flex:none;margin-top:2px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.note .tx{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.note b{color:var(--fg);font-weight:600}
.note.ok{color:var(--green)} .note.ok b{color:var(--green)}
.note.warn{color:var(--c-wip)} .note.warn b{color:var(--c-wip)}
.cd .ft{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:15px;flex-wrap:wrap}
.who{display:flex;align-items:center;gap:9px;color:var(--muted);font-size:15.5px}
.who svg{width:21px;height:21px;fill:var(--muted)}
.ftr{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:14px}
.dept{color:var(--faint);font-weight:500}
.dchip{--dc:#9aa3ab;display:inline-flex;align-items:center;gap:6px;padding:2px 10px 2px 8px;border-radius:999px;font-size:12.5px;font-weight:700;line-height:1.5;color:var(--dc);background:color-mix(in srgb,var(--dc) 15%,transparent);border:1px solid color-mix(in srgb,var(--dc) 38%,transparent);white-space:nowrap;vertical-align:middle;transition:background .15s,transform .15s}
.dchip i{width:7px;height:7px;border-radius:50%;background:var(--dc)}
.dchip:hover{background:color-mix(in srgb,var(--dc) 28%,transparent);transform:translateY(-1px)}
.dchip.big{font-size:14px;padding:4px 13px 4px 10px}
.dchip em{font-style:normal;opacity:.7;font-weight:600}
.dchip.on{background:var(--dc);color:#0b0f0d;border-color:var(--dc)}
.dchip.on i{background:#0b0f0d}
.dchip.off{opacity:.45}
.deptrow{gap:8px}
.deptrow .dl{font-size:14px;color:var(--muted);margin-right:4px}
.wn{margin-right:8px}
.who .dchip{margin-left:0}
.sheet .meta .dchip{font-size:13.5px}
.hbtn{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600;color:var(--muted);padding:5px 11px;border-radius:999px;background:var(--card2)}
.hbtn:hover{color:var(--fg);background:var(--line)}
.hbtn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.hbtn em{font-style:normal;color:var(--c-wip)}
.it .d.nd small{font-size:13px;line-height:1.3;color:var(--faint);margin-top:2px}
.path .due{color:var(--fg)}
.path b{font-weight:600}
.tag{border:1.5px solid var(--line);border-radius:999px;padding:4px 15px;font-size:14.5px;color:var(--muted);white-space:nowrap}
.here{margin:30px 0 30px;align-items:center}
.here .d{font-weight:800;color:var(--c-here)}
.here .d b{display:block;font-size:32px;line-height:1}
.here .d span{display:block;font-size:19px;opacity:.85;margin-top:4px}
.here .p{justify-self:center;width:30px;height:30px;border-radius:50%;background:var(--c-here);box-shadow:0 0 0 8px color-mix(in srgb,var(--c-here) 25%,transparent);position:relative;z-index:1}
.here .t{margin-left:20px;font-size:26px;font-weight:800;letter-spacing:-.02em}
.more{margin:4px 0 22px}
.more button{grid-column:3;justify-self:start;margin-left:20px;color:var(--accent);font-size:16px;font-weight:600;padding:10px 18px;border-radius:12px;background:var(--card)}
.more button:hover{background:var(--card2)}
.emptyrow{grid-column:3;margin-left:20px;color:var(--faint);font-size:16px;padding:6px 0 10px}
.listv{margin-top:22px}
.empty{color:var(--faint);padding:30px 0;text-align:center;font-size:16px}

/* footer + sheet */
.foot{margin-top:60px;padding-top:18px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:14px;color:var(--faint)}
.foot a{color:var(--accent)}
.foot button{color:var(--accent);font-weight:600;font-size:14px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
.ov.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;bottom:0;transform:translate(-50%,100%);visibility:hidden;width:min(780px,100%);max-height:90vh;overflow:auto;background:var(--card);border:1px solid var(--line);border-bottom:0;border-radius:24px 24px 0 0;z-index:21;transition:transform .25s ease;padding:14px 30px 34px}
.sheet.on{transform:translate(-50%,0);visibility:visible}
.grab{width:44px;height:5px;border-radius:5px;background:var(--line);margin:0 auto}
.shead{position:sticky;top:-14px;z-index:3;margin:-14px -30px 6px;padding:12px 30px 10px;background:var(--card);display:flex;justify-content:center;align-items:center;min-height:44px;touch-action:none;cursor:grab}
.sx{position:absolute;right:16px;top:8px;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--card2);color:var(--muted)}
.sx:hover{color:var(--fg);background:var(--line)}
.sx svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round}
.sheet.drag{transition:none!important}
html.noscroll,html.noscroll body{overflow:hidden}
.sheet{overscroll-behavior:contain}
.sheet h2{font-size:25px;font-weight:800;line-height:1.3;margin:12px 0 12px;letter-spacing:-.015em}
.sheet .k{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.sheet .meta{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin:16px 0}
.sheet .meta div{background:var(--card2);border-radius:12px;padding:10px 13px}
.sheet .meta span{display:block;font-size:12.5px;color:var(--muted)}
.sheet .meta b{font-weight:600;font-size:15px}
.sheet .meta .ok b{color:var(--green)}
.sheet h5{font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:24px 0 10px}
.sheet .txt{font-size:16px;line-height:1.65;white-space:pre-wrap;word-break:break-word;color:#d5dade}
.lk{display:grid;grid-template-columns:150px 1fr auto auto;gap:12px;align-items:center;padding:9px 12px;background:var(--card2);border-radius:12px;margin-bottom:6px;font-size:14.5px;cursor:pointer}
.lk:hover{outline:1px solid var(--line)}
.lk .t{color:var(--muted);font-size:13.5px}
.lk .s{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lk .s b{color:var(--accent);font-weight:600;margin-right:8px}
.lk .pill{font-size:12.5px;padding:3px 9px}
.cm{padding:12px 14px;background:var(--card2);border-radius:12px;margin-bottom:8px}
.cm .h{font-size:13px;color:var(--muted);margin-bottom:4px}
.cm .h b{color:var(--fg);font-weight:600}
.cm .x{font-size:15px;line-height:1.55;white-space:pre-wrap;word-break:break-word}
.path{font-size:14.5px;display:flex;flex-direction:column;gap:2px;border-left:2px solid var(--line);padding-left:16px}
.path div{display:grid;grid-template-columns:110px 12px 1fr;gap:10px;align-items:center;padding:3px 0}
.path .dd{color:var(--faint);font-variant-numeric:tabular-nums}
.path .pp{width:10px;height:10px;border-radius:50%}
.path .w{color:var(--faint)}
.cta{display:inline-flex;align-items:center;gap:8px;background:var(--accent);color:#06200f;border-radius:999px;padding:13px 24px;font-weight:700;font-size:16px;margin-top:24px}
.ghost{color:var(--muted);font-size:16px;margin-left:16px}
.cta.jira{background:linear-gradient(180deg,#1f6fe8,#1559c7);color:#fff;gap:10px;padding:12px 22px 12px 18px;box-shadow:0 6px 20px rgba(21,89,199,.35);transition:transform .15s,box-shadow .15s,filter .15s}
.cta.jira:hover{transform:translateY(-1px);box-shadow:0 10px 26px rgba(21,89,199,.45);filter:brightness(1.06)}
.cta.jira .ji{width:19px;height:19px;fill:none;stroke:#fff;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.cta.jira .ja{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;opacity:.85}
.sheet ol{padding-left:22px;margin:8px 0 16px;display:flex;flex-direction:column;gap:10px;font-size:15.5px}
.sheet textarea{width:100%;min-height:100px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--fg);font:13px ui-monospace,monospace;padding:12px;resize:vertical}
.bm{display:inline-block;background:var(--ochre);color:#1b1408;border-radius:999px;padding:5px 14px;font-weight:700;font-size:14px;cursor:grab}
.small{font-size:14px;color:var(--muted)}
.msg{font-size:15px;margin:10px 0 4px}
.msg.err{color:var(--c-blocked)} .msg.ok{color:var(--green)}

/* fresh */
:root{--c-new:#5ab8ff}
.pills{display:inline-flex;gap:8px;align-items:center;flex-wrap:wrap}
.nb{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:700;color:var(--c-new);background:color-mix(in srgb,var(--c-new) 14%,transparent);border:1px solid color-mix(in srgb,var(--c-new) 40%,transparent);border-radius:999px;padding:3px 10px 3px 8px;white-space:nowrap;vertical-align:middle}
.nb i{width:7px;height:7px;border-radius:50%;background:var(--c-new);animation:npulse 1.8s ease-out infinite}
.lr .tt .nb{margin-right:10px;font-size:11.5px;padding:1px 8px 1px 7px}
@keyframes npulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--c-new) 70%,transparent)}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
.accnote{font-size:14px;color:var(--muted);padding:2px 6px 10px}

/* done shine */
.isdone{position:relative;overflow:hidden;isolation:isolate}
.isdone.shine::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;background:color-mix(in srgb,var(--green) 16%,transparent);opacity:0;animation:dfill 1.8s ease-in-out both}
.isdone.shine::after{content:"";position:absolute;top:0;bottom:0;left:0;width:60%;pointer-events:none;background:linear-gradient(100deg,transparent 0%,color-mix(in srgb,var(--green) 10%,transparent) 30%,color-mix(in srgb,#ffffff 22%,color-mix(in srgb,var(--green) 30%,transparent)) 50%,color-mix(in srgb,var(--green) 10%,transparent) 70%,transparent 100%);transform:translateX(-120%) skewX(-12deg);animation:dsweep 1.3s cubic-bezier(.45,0,.2,1) .1s both}
.isdone.shine{animation:dglow 1.8s ease-in-out both}
.lr.isdone.shine,.ev.isdone.shine{animation:dglow 1.8s ease-in-out both}
@keyframes dsweep{to{transform:translateX(260%) skewX(-12deg)}}
@keyframes dfill{0%{opacity:0}35%{opacity:1}100%{opacity:0}}
@keyframes dglow{0%{box-shadow:0 0 0 0 transparent}35%{box-shadow:0 0 0 1.5px color-mix(in srgb,var(--green) 60%,transparent),0 0 28px color-mix(in srgb,var(--green) 22%,transparent)}100%{box-shadow:0 0 0 0 transparent}}

/* month ladder */
.month{background:var(--card);border-radius:20px;margin-top:30px;padding:18px 22px 10px;animation:rise .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:.12s}
.mhd{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.mhd .ib{width:38px;height:38px;background:var(--card2)}
.mhd .ib svg{width:20px;height:20px}
.mtt{flex:1;text-align:center}
.mtt h3{margin:0;font-size:21px;font-weight:800;letter-spacing:-.015em}
.mtt span{font-size:13.5px;color:var(--muted)}
.mnow{color:var(--accent);font-weight:600;font-size:14px;margin-left:4px}
.mtl{margin-top:14px}
.mtabs{display:flex;gap:6px;justify-content:center;margin:12px 0 2px}
.mtabs button{display:inline-flex;align-items:center;gap:8px;padding:8px 16px;border-radius:999px;font-size:14.5px;font-weight:600;color:var(--muted);background:var(--card2);border:1px solid transparent;transition:background .15s,color .15s}
.mtabs button:hover{color:var(--fg)}
.mtabs button.on{background:var(--fg);color:var(--bg)}
.mtabs button i{width:8px;height:8px;border-radius:50%;background:var(--c-new);animation:npulse 1.8s ease-out infinite}
.mtabs em{font-style:normal;opacity:.6}
.mempty{text-align:center;color:var(--muted);font-size:14.5px;margin:14px 8px 0}
.mtl::before{left:93px}
.mtl .row{grid-template-columns:72px 44px 1fr}
.mtl .gap{margin:2px 0 6px;align-items:center}
.mtl .gap .p{justify-self:center;width:7px;height:7px;border-radius:50%;background:var(--line);position:relative;z-index:1}
.mtl .gt{margin-left:14px;font-size:13.5px;color:var(--faint)}
.mtl .here{margin:10px 0 14px}
.mtl .here .t{margin-left:14px;font-size:22px}
.mtl .here .t small{font-size:14px;color:var(--muted);font-weight:600;margin-left:6px}
.mtl .here .d b{font-size:28px}
.mtl .here .d span{font-size:16px}
.mday{margin-bottom:12px}
.mday .d{padding-top:10px}
.mday .d b{display:block;font-size:26px;font-weight:800;line-height:1}
.mday .d span{display:block;font-size:14px;color:var(--muted);margin-top:3px}
.mday .p{justify-self:center;margin-top:14px;width:18px;height:18px;border-radius:50%;background:var(--bg);border:5px solid var(--c);position:relative;z-index:1}
.mday .p.none{visibility:hidden}
.evs{margin-left:14px;display:flex;flex-direction:column;gap:8px}
.ev{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;background:var(--card2);border-radius:14px;padding:11px 14px;cursor:pointer;animation:rise .4s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*40ms);transition:background .15s,transform .15s}
.ev:hover{background:var(--line);transform:translateX(3px)}
.ev .pill{font-size:12.5px;padding:3px 10px;min-width:132px;text-align:center}
.evt{font-weight:600;font-size:15.5px;line-height:1.35}
.evm{font-size:13.5px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:3px}

/* accordions */
.accs{display:flex;flex-direction:column;gap:12px;margin-top:30px}
.acc{background:var(--card);border-radius:18px;border:1px solid transparent;transition:border-color .2s}
.acc.on{border-color:var(--line)}
.acc-h{width:100%;display:flex;align-items:center;gap:12px;padding:18px 20px;text-align:left;font-size:18px;font-weight:700}
.acc-h i{width:11px;height:11px;border-radius:50%;flex:none}
.acc-t{flex:1}
.acc-n{min-width:34px;height:28px;padding:0 10px;border-radius:14px;background:var(--card2);display:grid;place-items:center;font-size:15px;font-weight:700;color:var(--muted)}
.chev{width:22px;height:22px;stroke:var(--muted);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.acc.on .chev{transform:rotate(180deg)}
.acc-b{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s cubic-bezier(.2,.8,.2,1)}
.acc.on .acc-b{grid-template-rows:1fr}
.acc-in{overflow:hidden;padding:0 14px}
.acc.on .acc-in{padding-bottom:14px}
.acc-in .rows .lr{background:var(--card2)}
.acc-in .rows .lr:hover{background:var(--line)}
.acc:not(.on) .lr{animation:none}
.acc-all{margin:12px 6px 2px;color:var(--accent);font-weight:600;font-size:15px}

/* motion */
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--c-here) 55%,transparent)}70%{box-shadow:0 0 0 16px transparent}100%{box-shadow:0 0 0 0 transparent}}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
#app>.wrap{animation:fade .35s ease both}
.tile{animation:rise .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*45ms)}
.stat,.panel,.acc,.hero,.tools{animation:rise .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:.15s}
.it,.lr{animation:rise .45s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*40ms)}
.it .p{animation:pop .45s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*40ms + 80ms)}
.here .p{animation:pulse 2.4s ease-out infinite}
.prog i,.mbar .t i{transform-origin:left;animation:grow .9s cubic-bezier(.2,.8,.2,1) both;animation-delay:.2s}
.tl::before{transform-origin:top;animation:grow-y .8s ease both}
@keyframes grow-y{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.stat,.kv button,.chip,.seg button,.hbtn,.lr,.cd{transition:transform .18s ease,background .18s,border-color .18s,color .18s}
.stat:hover,.kv button:hover{transform:translateY(-2px)}
.stat:active,.kv button:active,.tile:active .sq,.chip:active{transform:scale(.97)}
.it:hover .cd{transform:translateX(3px)}
.ov{transition:opacity .25s}
.sheet{transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.sheet.on>*{animation:rise .4s cubic-bezier(.2,.8,.2,1) both}
/* QA bugs */
.qsr{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:10px}
.qs{background:var(--card2);border-radius:12px;padding:9px 12px;text-align:left;transition:transform .18s,background .18s}
.qs:hover{background:var(--line);transform:translateY(-2px)}
.qs b{display:block;font-size:22px;font-weight:800;line-height:1.1}
.qs span{font-size:12.5px;color:var(--muted);display:flex;gap:6px;align-items:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qs i,.qah svg{flex:none}
.qs i{width:8px;height:8px;border-radius:50%}
.qstats{margin-top:24px}
.qalert{margin-top:18px;background:color-mix(in srgb,var(--c-blocked) 9%,var(--card));border:1px solid color-mix(in srgb,var(--c-blocked) 35%,transparent);border-radius:18px;padding:14px 14px 14px;animation:rise .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:.2s}

.qalert .lr{background:var(--card2)} .qalert .lr:hover{background:var(--line)}
.lr .r b{white-space:nowrap}
.qlist{display:flex;flex-direction:column;gap:12px;margin-top:18px}
.qmo{font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:18px 2px 0}

.qr{position:relative;background:var(--card);border:1px solid transparent;border-left:3px solid var(--c);border-radius:16px;padding:18px 20px;cursor:pointer;min-width:0;animation:rise .45s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*40ms);transition:border-color .15s,background .15s,transform .18s}

.mmb{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600;color:var(--muted);padding:5px 11px;border-radius:999px;background:var(--card2)}
.mmb:hover{color:var(--fg);background:var(--line)}
.mmb svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.mmb em{font-style:normal;color:var(--fg)}
.note.bad{color:var(--c-blocked)} .note.bad b{color:var(--c-blocked)}
.sheet .meta .bad b{color:var(--c-blocked)}
.sheet .note{margin:4px 0 0}

.qrep{margin-top:4px}

.qml{font-weight:700;font-size:15px}

.qkv{margin-bottom:2px}

/* lock screen */

.lk-ico{width:62px;height:62px;border-radius:18px;background:color-mix(in srgb,var(--green) 16%,transparent);display:grid;place-items:center;margin:0 auto 18px}
.lk-ico svg{width:30px;height:30px;stroke:var(--green);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

<script>
const BASE = /*__DATA__*/null;
const BASE_QA = /*__QA__*/null;
const JIRA = 'https://jira.blackhub.team/browse/';

/* ---------- dictionaries ---------- */
function stageOf(name, cat){
  const n = (name||'').toLowerCase().trim();
  if (/^(backlog|description|descripton|на подумать|open)$/.test(n)) return 'idea';
  if (/^(estimation|ready to work|pending|оценка)$/.test(n)) return 'est';
  if (/^(сделать|to do|reopened|открыт|selected for development)$/.test(n)) return 'todo';
  if (/^(blocked|заблокирован)/.test(n)) return 'blocked';
  if (/^(в работе|in progress)$/.test(n)) return 'wip';
  if (/(review|test|qa|ревью|тест)/.test(n)) return 'review';
  if (/^(готово|done|confirmed|closed|resolved|закрыт)/.test(n)) return 'done';
  if (/^(reject|отклон|won't do)/.test(n)) return 'reject';
  return cat==='done' ? 'done' : cat==='indeterminate' ? 'wip' : 'todo';
}
const SC = {done:'var(--c-done)', wip:'var(--c-wip)', review:'var(--c-review)', blocked:'var(--c-blocked)', todo:'var(--c-todo)', est:'var(--c-est)', idea:'var(--c-idea)', reject:'var(--c-idea)'};
const SL = {done:'Готово', wip:'В работе', review:'На проверке', blocked:'Заблокировано', todo:'В очереди', est:'На оценке', idea:'Идея', reject:'Отклонено'};
const ST_RU = {
  'backlog':'Бэклог','description':'Описание','descripton':'Описание','на подумать':'На подумать','estimation':'Оценка','ready to work':'Оценено',
  'to do':'В очереди','сделать':'В очереди','in progress':'В работе','в работе':'В работе','tech review':'Тех. ревью','request review':'Запрос ревью',
  'qa review':'QA-ревью','design review':'Ревью дизайна','ready to test':'Готово к тесту','preparing to test':'Подготовка к тесту','in test':'Тестирование',
  'done':'Готово','готово':'Готово','reject':'Отклонено','reopened':'Переоткрыто','blocked':'Заблокировано','pending':'Ожидание','confirmed':'Подтверждено','closed':'Закрыто','open':'Открыто'
};
const ru = s => ST_RU[(s||'').toLowerCase().trim()] || s;
const PRIO_RU = {'Блокер':'Блокер','Highest':'Наивысший','High':'Высокий','Medium':'Средний','Low':'Низкий','Lowest':'Минимальный','Незначительный':'Незначительный'};

function linkLabel(t){ t=(t||'').replace(/^\d+\s*-\s*/,'').replace(/:\s*$/,'').trim(); return ({'Includes':'Включает','is included in':'Входит в','relates to':'Связана с','blocks':'Блокирует','is blocked by':'Блокируется','duplicates':'Дублирует','is duplicated by':'Дубликат'})[t]||t; }

/* ---------- categories ---------- */
const IC = {
  tools:'<path d="M14.7 6.3a4 4 0 0 0-5.4 5.2L3.5 17.3a1.8 1.8 0 0 0 2.6 2.6l5.8-5.8a4 4 0 0 0 5.2-5.4l-2.6 2.6-2.4-.4-.4-2.4z"/>',

  logs:'<rect x="3.5" y="4.5" width="17" height="15" rx="2.5"/><path d="M7.5 9.5l2.5 2.5-2.5 2.5M12.5 15h4"/>',
  ops:'<path d="M20 12a8 8 0 1 1-2.4-5.7M20 4v4.5h-4.5"/><path d="M12 8v4l2.5 2"/>',

  chat:'<path d="M5 5h14a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H10l-5 4v-4a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2z"/>',
  link:'<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/>',

const PERSON = '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="7.5" r="4.5"/><path d="M3 21c0-4.4 4-7 9-7s9 2.6 9 7z"/></svg>';

const CATS = [
  {id:'tools', lbl:'Инструменты', name:'Инструменты тех. специалистов', desc:'/ireset, /ainv, /arecovery, /remacc, Recovery-сайт', bg:'#1f5a50', fg:'#e9f5f1'},
  {id:'auto',  lbl:'Автоматизация', name:'Автоматизация и боты', desc:'Автовыдача ЧСП/ЧСА, BlackLogs, восстановлений; боты и формы', bg:'#b88a3e', fg:'#fff8ec'},
  {id:'team',  lbl:'Мотивация', name:'Мотивация, обучение и ОС', desc:'Система мотивации, опросы, обучение, распределение состава', bg:'#6f8069', fg:'#f4f7f1'},
  {id:'docs',  lbl:'Документация', name:'Документация Notion', desc:'ТЗ и актуализация документации по инструментам', bg:'#3a4a5c', fg:'#e6edf5'},
  {id:'logs',  lbl:'Логирование', name:'Логирование BLACK LOG', desc:'Доработки системы логов, эпик AN-139', bg:'#2f4f4a', fg:'#d8ece6'},
  {id:'ops',   lbl:'Восстановления', name:'Восстановления и разборы', desc:'Компенсации, обработка таблиц, баги и инциденты', bg:'#b4552f', fg:'#fff1ea'},
  {id:'ideas', lbl:'Идеи', name:'Идеи на проработку', desc:'Предложения, которые ещё обсуждаются, эпик CS-429', bg:'#262d33', fg:'#e0a83a'},
  {id:'all',   lbl:'Все задачи', name:'Все задачи 2026', desc:'Все направления на одной линии времени', bg:'#e9e2d5', fg:'#1f3431'},
];
const CMAP = Object.fromEntries(CATS.map(c=>[c.id,c]));
const OVERRIDE = {'CS-425':'team','CS-448':'team','CS-372':'team','CS-205':'docs','CS-384':'docs','CS-454':'ops','CS-469':'ideas'};
const BOT = /(^|[^а-яё])бот(а|ов|ы|у)?([^а-яё]|$)/i;
function clusterOf(i){
  if (OVERRIDE[i.k]) return OVERRIDE[i.k];
  const s = (i.s||'').toLowerCase();
  if (i.e==='AN-139' || /black log/.test(s)) return 'logs';
  if (i.e==='CS-423' || /notion\s*\|/.test(s) || /документац|договорённост|договоренност/.test(s)) return 'docs';
  if (i.e==='CS-424' || /мотивац|опрос|обуч|canva|quizizz|квиз|дашборд|преми/.test(s)) return 'team';
  if (/автоматизац|форм[аыу] заполнения|web-верс|напоминание jira|logs black russia/.test(s) || BOT.test(s)) return 'auto';
  if (/\/(ireset|ainv|arecovery|remacc|tfammenu|reward)\b|recovery-сайт/.test(s)) return 'tools';
  if (i.e==='CS-429') return 'ideas';
  return 'ops';
}
function toolOf(i){
  const m = (i.s||'').match(/\/(ireset|ainv|arecovery|remacc|tfammenu|reward|aedit|epoints|banword)\b/i);
  if (m) return '/'+m[1].toLowerCase();
  if (/recovery[- ]?(сайт|manager)/i.test(i.s)) return 'Recovery';
  if (/black log/i.test(i.s)) return 'BLACK LOG';
  if (/black manager/i.test(i.s)) return 'Black Manager';
  return '';
}
function cleanTitle(s){
  return (s||'').replace(/^\s*(TechSupport|Server(\s*\[Bug\])?|Web|GD|Analytics|CS Support|Support|CS)\s*:\s*/i,'')
    .replace(/^Notion\s*\|\s*/i,'').replace(/^BLACK LOG\s*\|\s*/i,'').replace(/\s+/g,' ').trim();
}
function shortName(n){ return n ? n.replace(/\s*\(.*$/,'').trim() : ''; }
const DEPT_PREFIX = {'techsupport':'TechSupport','support':'Support','cs support':'Support','server':'Server','gd':'Геймдизайн','web':'Web','cs hub':'Web','qa':'QA','mobile':'Mobile','client':'Client','analytics':'Аналитика','design':'Дизайн'};
const DEPT_PROJECT = {'CS':'Customer Service','BR':'Black Russia','AN':'Аналитика','WEB':'Web'};
const DEPT_JIRA = {'gd':'Геймдизайн','analytics':'Аналитика','cs: support':'TechSupport','customer service':'Customer Service'};
const depJira = d => d ? (DEPT_JIRA[d.toLowerCase()] || d) : '';
function deptOf(key, summary){
  const m = (summary||'').match(/^\s*\[?([A-Za-z][A-Za-z ]*?)\]?(\s*\[Bug\])?\s*:/);
  if (m && DEPT_PREFIX[m[1].toLowerCase()]) return DEPT_PREFIX[m[1].toLowerCase()];
  const p = (key||'').split('-')[0];
  return DEPT_PROJECT[p] || PROJECTS[p] || p;
}
const OUR = 'TechSupport';
const QA_DEPT = 'Передано из MM';
let PROJECTS = {};
const DEPT_C = {'TechSupport':'#34c759','Customer Service':'#34c759','Support':'#94d82d','Server':'#4c8dff','Web':'#22b8cf','Геймдизайн':'#f06595','Аналитика':'#b28cff','QA':'#f2a516','Mobile':'#ff922b','Client':'#ffa94d','Дизайн':'#e599f7','Black Russia':'#9aa3ab','Передано из MM':'#e8577a'};
const deptColor = d => { if (DEPT_C[d]) return DEPT_C[d]; if (/^client/i.test(d)) return '#ffa94d'; if (/^3d/i.test(d)) return '#20c997'; if (/ux|ui/i.test(d)) return '#e599f7'; if (/не указан/.test(d)) return '#6b7680'; let h=0; for (const c of String(d)) h=(h*31+c.charCodeAt(0))%360; return `hsl(${h} 65% 66%)`; };
function deptChip(d, big, label){ return `<button class="dchip ${big?'big':''}" data-dept="${esc(d)}" title="Показать задачи: ${esc(d)}" style="--dc:${deptColor(d)}"><i></i>${esc(label||d)}</button>`; }
function iDept(i, big){ return deptChip(i.dept, big) + (i.isQa ? qaTag(qaPassedBy(i)) : ''); }
function whoHtml(i){ return `<span class="wn">${esc(i.who||'Не назначен')}</span>${iDept(i)}`; }
function tidy(d){
  return (d||'').replace(/https?:\/\/\S+/g,'').replace(/\[\^?[^\]]*\]/g,'').replace(/\b(link\s+)?[0-9a-f]{20,}\b/gi,'')
    .replace(/-{3,}/g,' ').replace(/\s[{}]\s/g,' ').replace(/\s+/g,' ').replace(/\s*[\[(]\s*$/,'').trim();
}
function shortDesc(d){
  d = tidy(d).replace(/^(Задача|Описание( задачи)?|Требуется|Техническое задание|Документация)\s*:?\s*/i,'');

}

/* ---------- utils ---------- */
const TODAY = new Date();
const TODAY_S = TODAY.getFullYear()+'-'+String(TODAY.getMonth()+1).padStart(2,'0')+'-'+String(TODAY.getDate()).padStart(2,'0');
const MON_S = ['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
const MON_F = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const MON_G = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const dLong = d => d ? (+d.slice(8,10))+' '+MON_G[+d.slice(5,7)-1]+' '+d.slice(0,4) : '';
const dShort = d => { if(!d) return ''; const y = d.slice(0,4)!==String(TODAY.getFullYear()) ? ' '+d.slice(0,4) : ''; return (+d.slice(8,10))+' '+MON_S[+d.slice(5,7)-1]+y; };
function fmtDT(iso){ try{ const d=new Date(iso); return d.getDate()+' '+MON_G[d.getMonth()]+', '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }catch(e){ return iso; } }
function plural(n,a,b,c){ n=Math.abs(n)%100; const n1=n%10; if(n>10&&n<20) return c; if(n1>1&&n1<5) return b; if(n1===1) return a; return c; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
const ym = d => d ? d.slice(0,7) : '';
function monthKey(offset){ const d=new Date(TODAY.getFullYear(), TODAY.getMonth()+offset, 1); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
const FRESH_DAYS = 30;
const daysAgo = d => d ? Math.max(0, Math.round((new Date(TODAY_S+'T12:00:00') - new Date(d+'T12:00:00'))/864e5)) : null;
function agoText(n){ if (n===0) return 'сегодня'; if (n===1) return 'вчера'; return n+' '+plural(n,'день','дня','дней')+' назад'; }
const monthName = m => MON_F[+m.slice(5,7)-1]+' '+m.slice(0,4);

/* ---------- data ---------- */
function normalize(raw){
  PROJECTS = raw.projects || {};
  const issues = (raw.issues||[]).map(normIssue);
  const by = Object.fromEntries(issues.map(i=>[i.k,i]));
  const tasks = issues.filter(i=>!i.isEpic && i.stage!=='reject');
  const qby = {}, qtasks = []; ((raw.qa&&raw.qa.issues)||[]).forEach(x=>{ const i=normIssue(x); i.cl='qa'; i.isQa=true; i.dept = depJira(i.dp) || (i.dept==='Black Russia' ? 'Отдел не указан' : i.dept); qby[i.k]=i; (i.aka||[]).forEach(a=>{ if(!qby[a]) qby[a]=i; }); if (!by[i.k] && !i.isEpic && i.stage!=='reject') qtasks.push(i); });
  return { raw, tasks, by, qby, qtasks };
}
function normIssue(x){
    const i = Object.assign({}, x);
    i.stage = stageOf(i.st, i.sc);
    i.isEpic = /^(epic|эпик)$/i.test(i.t||'');
    i.cl = clusterOf(i);
    i.title = cleanTitle(i.s);
    i.who = shortName(i.a);
    i.tr = Array.isArray(i.tr) ? i.tr : [];
    i.cm = (Array.isArray(i.cm) ? i.cm : []).map(c=>[c[0], c[1], tidy(c[2])]).filter(c=>c[2]);
    i.ln = Array.isArray(i.ln) ? i.ln : [];
    const last = [...i.tr].reverse().find(t=>stageOf(t[1])===i.stage);
    i.since = last ? last[0] : i.c;
    const lastDone = [...i.tr].reverse().find(t=>stageOf(t[1])==='done');
    i.doneAt = i.stage==='done' ? (i.r || (lastDone && lastDone[0]) || i.since) : null;
    i.sd = shortDesc(i.desc);
    i.dept = deptOf(i.k, i.s);
    i.age = daysAgo(i.c);
    i.fresh = i.age!=null && i.age <= FRESH_DAYS;
    i.dd = Array.isArray(i.dd) ? i.dd : [];
    i.shifts = i.dd.filter(x=>x[1] && x[2] && x[1]!==x[2]);
    i.deps = i.ln.filter(l=>/после|blocked by|блокируется/i.test(l.t) && l.sc!=='done');
    i.lastAct = [i.u, i.since, (i.cm[i.cm.length-1]||[])[0]].filter(Boolean).sort().pop();
    i.fv = Array.isArray(i.fv) ? i.fv : [];
    return i;
}

  {id:'done', name:'По дате выполнения', f:(a,b)=>(b.doneAt||'').localeCompare(a.doneAt||'')},
  {id:'created', name:'По дате создания', f:(a,b)=>(b.c||'').localeCompare(a.c||'')},
  {id:'title', name:'По названию', f:(a,b)=>a.title.localeCompare(b.title,'ru')},
];
const STAGE_ORD = {review:0,wip:1,blocked:2,todo:3,est:4,idea:5,done:6,reject:7};

function filterItems(base, ignoreGroup){
  const q = F.q.toLowerCase();
  return base.filter(i=>{
    if (!ignoreGroup && !GMAP[F.group].f(i)) return false;
    if (F.person && (F.person==='—' ? i.who : i.who!==F.person)) return false;
    if (F.dept && i.dept!==F.dept) return false;
    if (F.month && ym(i.doneAt)!==F.month) return false;
    if (q && ![i.k,i.s,i.desc,i.who,i.dept,toolOf(i),CMAP[i.cl].lbl, ...i.cm.map(c=>c[2])].some(x=>(x||'').toLowerCase().includes(q))) return false;
    return true;
  });
}

/* ---------- pieces ---------- */
function barHtml(title, isCat){
  const r = DATA.raw;
  return `<div class="bar"><div class="bar-in">

let MONTH = monthKey(0);
const WD = ['вс','пн','вт','ср','чт','пт','сб'];
const MON_P = ['январе','феврале','марте','апреле','мае','июне','июле','августе','сентябре','октябре','ноябре','декабре'];
function monthEvents(m){
  const days = {};
  const add = (d, ev)=>{ (days[d]=days[d]||[]).push(ev); };
  [...DATA.tasks, ...DATA.qtasks].forEach(i=>{
    const byDay = {};
    i.tr.forEach((t,idx)=>{ if (t[0].slice(0,7)===m){ (byDay[t[0]]=byDay[t[0]]||{from: idx>0?i.tr[idx-1][1]:null, chain:[], who:new Set()}); byDay[t[0]].chain.push(t[1]); if(t[2]) byDay[t[0]].who.add(t[2]); } });
    Object.entries(byDay).forEach(([d,v])=>{
      const last = v.chain[v.chain.length-1];
      const isDone = stageOf(last)==='done';
      add(d, {i, kind: isDone?'done':'st', to:last, from:v.from, chain:v.chain, who:[...v.who].join(', '), w: isDone?5:3});
    });
    i.dd.forEach(x=>{ if (x[0].slice(0,7)===m) add(x[0], {i, kind:'due', from:x[1], to:x[2], who:x[3], w:2}); });
    if (i.c && i.c.slice(0,7)===m) add(i.c, {i, kind:'new', w:1});
    if (i.d && i.d.slice(0,7)===m && i.stage!=='done') add(i.d, {i, kind:'deadline', w:4});
  });
  const ORD = {new:1, due:2, st:3, done:4, deadline:5};
  Object.values(days).forEach(a=>a.sort((x,y)=>ORD[x.kind]-ORD[y.kind]));
  return days;
}

const MTAB = 'all';
function monthLadder(){
  const m = MONTH, y = +m.slice(0,4), mo = +m.slice(5,7);
  const n = new Date(y, mo, 0).getDate();
  const isCur = m===monthKey(0), isPast = m < monthKey(0);
  const today = TODAY.getDate();
  const evAll = monthEvents(m);
  const total = Object.values(evAll).reduce((a,x)=>a+x.length,0);
  const cnt = k => Object.values(evAll).flat().filter(e=>e.kind===k).length;
  const nNew = cnt('new');
  const isNew = MTAB==='new';
  const ev = {};
  Object.entries(evAll).forEach(([d,l])=>{ const f = isNew ? l.filter(e=>e.kind==='new') : l; if (f.length) ev[d]=f; });
  let rows = '', gap = null;
  const flush = ()=>{ if (!gap) return; const a=gap[0], b=gap[1]; const future = isCur ? a>today : !isPast;
    rows += `<div class="row gap"><div class="d"></div><span class="p"></span><div class="gt">${a===b?a:a+'–'+b} ${MON_S[mo-1]} · ${isNew ? (future?'ещё впереди':'новых задач не было') : (future?'запланированных сроков нет':'без изменений')}</div></div>`; gap=null; };
  for (let d=1; d<=n; d++){
    const key = m+'-'+String(d).padStart(2,'0');
    const list = ev[key];
    const here = isCur && d===today;
    if (!list && !here){ gap = gap ? [gap[0], d] : [d, d]; continue; }
    flush();
    const wd = WD[new Date(y, mo-1, d).getDay()];
    if (here) rows += `<div class="row here mh"><div class="d"><b>${d}</b><span>${MON_S[mo-1]}</span></div><span class="p"></span><div class="t">Вы здесь <small>${wd}</small></div></div>`;
    if (list){
      const PRIO_K = ['done','deadline','st','due','new'];
      const top = PRIO_K.map(k=>list.find(e=>e.kind===k)).find(Boolean) || list[0];
      const col = top.kind==='done'?'var(--c-done)':top.kind==='deadline'?'var(--c-blocked)':top.kind==='due'?'var(--c-wip)':top.kind==='st'?SC[stageOf(top.to)]:'var(--c-new)';
      rows += `<div class="row mday" style="--c:${col}"><div class="d">${here?'':`<b>${d}</b><span>${wd}</span>`}</div><span class="p ${here?'none':''}"></span><div class="evs">${list.map(evHtml).join('')}</div></div>`;
    }
  }
  flush();
  const mName = MON_F[mo-1]+' '+y;
  return `<div class="month">
    <div class="mhd"><button class="ib" data-mnav="-1" aria-label="Предыдущий месяц"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
      <div class="mtt"><h3>${mName}</h3><span>${isCur?'карта текущего месяца':isPast?'прошедший месяц':'будущий месяц'} · ${total} ${plural(total,'событие','события','событий')}${cnt('done')?` · выполнено ${cnt('done')}`:''}${cnt('deadline')?` · дедлайнов ${cnt('deadline')}`:''}</span></div>
      <button class="ib" data-mnav="1" aria-label="Следующий месяц"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
      ${!isCur?`<button class="mnow" data-mnav="0">Сегодня</button>`:''}</div>
    <div class="tl mtl">${rows}</div>
  </div>`;
}
/* shine for done tasks: once per element, in order of appearance */
const SHONE = new Set(); const SHQ = []; let SHBUSY = false;
const SHIO = ('IntersectionObserver' in window) ? new IntersectionObserver(entries=>{
  entries.filter(en=>en.isIntersecting).sort((a,b)=>a.boundingClientRect.top-b.boundingClientRect.top).forEach(en=>{
    const el = en.target; SHIO.unobserve(el);
    const k = el.dataset.sk; if (SHONE.has(k)) return; SHONE.add(k); SHQ.push(el);
  });
  if (!SHBUSY) pumpShine();
}, {threshold:0.6}) : null;
function pumpShine(){
  const el = SHQ.shift(); if (!el){ SHBUSY=false; return; }
  SHBUSY = true;
  if (el.isConnected){ el.classList.remove('shine'); void el.offsetWidth; el.classList.add('shine'); }
  setTimeout(pumpShine, el.isConnected ? 190 : 0);
}
function watchShine(){
  if (!SHIO) return;
  setTimeout(()=>document.querySelectorAll('.isdone[data-sk]').forEach(el=>{ if (!SHONE.has(el.dataset.sk)) SHIO.observe(el); }), 450);
}

  if (!QA){
    app.innerHTML = barHtml(c.name, true) + `<div class="wrap narrow"><div class="hero"><div class="sq" style="background:${c.bg};color:${c.fg}">${svg('qa')}</div><div><h2>${esc(c.name)}</h2><p>${esc(c.desc)}</p></div></div>
      <div class="empty">Данных из Mattermost пока нет. Нажмите «⟳ Обновить» и выполните шаг с закладкой «Sync QA Bugs».</div>${footHtml()}</div>`;
    return;
  }
  const L = qaReports();
  const pre = qaFilter(L, true), items = qaFilter(L, false);
  const s = qaStats(QF.month ? L.filter(x=>x.d.slice(0,7)===QF.month) : L);
  const sorted = [...items].sort(QSORTS.find(x=>x.id===QF.sort).f);
  const chips = ['all','stale','wait','nokey','jira','fixed','reject'].map(k=>`<button class="chip ${QF.st===k?'on':''}" data-qst="${k}">${k!=='all'?`<i style="background:${QS[k].c}"></i>`:''}${k==='all'?'Все':k==='stale'?'Без ответа > '+(QA.noReplyDays||7)+' дн.':QS[k].l} <em>${k==='all'?pre.length:pre.filter(x=>x.qs===k).length}</em></button>`).join('');
  const _a = QF.author; QF.author=''; const preNA = qaFilter(L, false); QF.author=_a;
  const authors = (QA.ours||[]).map(id=>`<button class="dchip big ${QF.author===id?'on':''} ${QF.author&&QF.author!==id?'off':''}" data-author="${esc(id)}" style="--dc:${staffColor(id)}"><i></i>${esc(shortStaff(id))} <em>${preNA.filter(x=>x.u===id).length}</em></button>`).join('');
  const srvCnt = {}; L.forEach(x=>{ if (x.srv) srvCnt[x.srv]=(srvCnt[x.srv]||0)+1; });
  const servers = Object.keys(srvCnt).sort((a,b)=>srvCnt[b]-srvCnt[a] || a.localeCompare(b,'ru'));
  const filtersActive = QF.q || QF.author || QF.server || QF.month || QF.st!=='all';
  const mCnt = {}; L.forEach(x=>{ const m=x.d.slice(0,7); mCnt[m]=(mCnt[m]||0)+1; });
  const months = Object.keys(mCnt).sort().reverse();
  const k = 'qa|list', lim = 30, all = expanded.has(k) || !!QF.q;
  let body = '', lastM = '';
  const shown = all ? sorted : sorted.slice(0, lim);
  const byMonth = QF.sort==='new' || QF.sort==='old';
  shown.forEach(x=>{ const m = x.d.slice(0,7); if (byMonth && m!==lastM){ lastM=m; body += `<div class="qmo">${monthName(m)} · ${sorted.filter(y=>y.d.slice(0,7)===m).length}</div>`; } body += qaCard(x); });
  const stale = L.filter(x=>x.qs==='stale').sort((a,b)=>b.silent-a.silent);
  const stat = (st,label,v,col)=>`<button class="stat" data-qst="${st}"><b ${st==='stale'&&v?'style="color:var(--c-blocked)"':''}>${v}</b><span><i style="background:${col}"></i>${label}</span></button>`;
  app.innerHTML = barHtml(c.name, true) + `<div class="wrap narrow">
    <div class="hero"><div class="sq" style="background:${c.bg};color:${c.fg}">${svg('qa')}</div><div><h2>${esc(c.name)}</h2><p>Заявки сотрудников ${(QA.ours||[]).map(id=>esc(shortStaff(id))).join(', ')} в канале QA: Bugs с ${dLong(QA.since)}. Статусы задач — из Jira.</p></div></div>
    <div class="stats qstats">
      ${stat('stale','без ответа',s.stale,QS.stale.c)}${stat('wait','ждут QA',s.wait,QS.wait.c)}${stat('nokey','без задачи',s.nokey,QS.nokey.c)}${stat('jira','в Jira',s.jira,QS.jira.c)}${stat('fixed','исправлено',s.fixed,QS.fixed.c)}
    </div>
    ${stale.length && QF.st==='all' && !filtersActive ? `<div class="qalert"><div class="qah">${ico('wait')}<b>Без ответа тестировщиков больше ${QA.noReplyDays||7} дней · ${stale.length}</b><button data-qst="stale">Показать все →</button></div><div class="rows">${stale.slice(0,5).map(qaRow).join('')}</div></div>` : ''}
    <div class="tools">
      <div class="trow"><label class="search">${ico('search')}<input id="qq" type="search" placeholder="Поиск по тексту, нику, серверу, ключу BR-…" value="${esc(QF.q)}"></label></div>
      <div class="trow"><div class="chips">${chips}</div></div>
      <div class="trow deptrow"><span class="dl">Кто передал</span>${authors}</div>
      <div class="trow">
        <select class="sel" id="qMon"><option value="">Все месяцы</option>${months.map(m=>`<option value="${m}" ${QF.month===m?'selected':''}>${monthName(m)} · ${mCnt[m]}</option>`).join('')}</select>
        <select class="sel" id="qSrv"><option value="">Все серверы</option>${servers.map(x=>`<option value="${esc(x)}" ${QF.server===x?'selected':''}>${esc(x)} · ${srvCnt[x]}</option>`).join('')}</select>
        <select class="sel" id="qSort">${QSORTS.map(x=>`<option value="${x.id}" ${QF.sort===x.id?'selected':''}>${x.name}</option>`).join('')}</select>
        ${filtersActive?`<span class="fnote">Найдено ${items.length} <button data-qreset="1">Сбросить фильтры</button></span>`:''}
      </div>
    </div>
    <div class="qlist">${body || '<div class="empty">Ничего не найдено</div>'}</div>
    ${sorted.length>lim && !QF.q ? `<div class="more" style="display:block;margin-top:12px"><button data-more="${k}" style="margin:0">${all?'Свернуть':'Показать ещё '+(sorted.length-lim)}</button></div>` : ''}
    ${qaFootHtml()}</div>`;
  const qq = document.getElementById('qq');
  if (qq){ let tm; qq.addEventListener('input', ()=>{ clearTimeout(tm); tm=setTimeout(()=>{ QF.q=qq.value.trim(); const pos=qq.selectionStart; render(); const n=document.getElementById('qq'); if(n){ n.focus(); try{n.setSelectionRange(pos,pos);}catch(e){} } },220); }); }
  const qm = document.getElementById('qMon'); if (qm) qm.addEventListener('change', ()=>{ QF.month=qm.value; expanded.clear(); render(); });
  const sv = document.getElementById('qSrv'); if (sv) sv.addEventListener('change', ()=>{ QF.server=sv.value; render(); });
  const so = document.getElementById('qSort'); if (so) so.addEventListener('change', ()=>{ QF.sort=so.value; render(); });
}
function qaFootHtml(){
  const r = DATA.raw;
  return `<div class="foot"><span>Mattermost на ${esc(fmtDT(QA.at))}${QA.by?' · обновил(а) '+esc(QA.by):''} · статусы Jira на ${esc(fmtDT((r.qa&&r.qa.at)||r.at))}</span><button data-sync="1">⟳ Обновить</button></div>`;
}
function openReport(id){
  const x = qaReports().find(r=>r.id===id); if (!x) return;
  const ours = new Set(QA.ours||[]);
  const box = (l,v,cls)=>v?`<div class="${cls||''}"><span>${l}</span><b>${v}</b></div>`:'';
  const sec = (h, v)=>v?`<h5>${h}</h5><div class="txt">${esc(v)}</div>`:'';
  const iss = (x.keys||[]).map(k=>{ const i = DATA.qby[k];
    if (!i) return `<div class="lk" data-open="${esc(k)}"><span class="t">Задача QA</span><span class="s"><b>${esc(k)}</b>Данные появятся после обновления из Jira</span><span></span><span></span></div>`;
    return `<div class="lk" data-open="${esc(k)}"><span class="t">${esc(i.who||'Не назначен')}</span><span class="s"><b>${esc(k)}</b>${esc(cleanTitle(i.s))}</span>${iDept(i)}${jiraPill(i)}</div>`; }).join('');
  const th = x.replies.map((m,n)=>(x.cut && n===3 ? `<div class="small" style="margin:4px 0 10px">… ещё ${x.nReplies-8} ${plural(x.nReplies-8,'сообщение','сообщения','сообщений')} — полностью в Mattermost …</div>` : '')+`<div class="cm ${ours.has(m[1])?'our':'qa'}"><div class="h"><b>${esc(userName(m[1]))}</b> · ${esc(fmtDT(m[0]))}${ours.has(m[1])?' · наш сотрудник':''}</div><div class="x">${esc(mdPlain(m[2]))}</div></div>`).join('');
  const ev = (x.evidence||[]).map(u=>`<a class="ev-l" href="${esc(u)}" target="_blank" rel="noopener">${esc(u.replace(/^https?:\/\//,'').slice(0,60))}</a>`).join('');
  openSheet(`
    <div class="k">${qsPill(x)}${x.main?jiraPill(x.main):''}${staffChip(x.u)}<span>${esc(fmtDT(x.at))}</span></div>
    <h2>${esc(x.title)}</h2>
    ${qaNotes(x)}
    <div class="meta">
      ${box('Сервер', esc(x.server))}${box('Платформа', esc(x.platform))}${box('Ник игрока', esc(x.nick))}${box('Когда произошло', esc(x.when))}
      ${box('Устройство', esc(x.device))}${box('Версия клиента', esc(x.ver))}${box('Связано с релизом', esc(x.release))}
      ${box('Передал(а)', esc(userName(x.u)))}${box('Ответов в треде', String(x.nReplies||0))}${box('Первый ответ QA', x.firstQa?esc(fmtDT(x.firstQa)):'нет')}
      ${x.remind?box('Напоминаний', String(x.remind)):''}${x.fixBy?box('Обещали исправить к', dLong(x.fixBy), x.overdue?'bad':''):''}
    </div>
    ${iss?`<h5>Задачи в Jira · ${(x.keys||[]).length}</h5>${iss}`:''}
    ${x.tpl ? sec('Суть проблемы', x.short) + sec('Влияние', x.impact) + sec('Охват', x.reach) + sec('Частота', x.freq) + sec('Шаги воспроизведения', x.steps) + sec('Комментарий CS', x.cs) : sec('Текст заявки', x.raw)}
    ${ev?`<h5>Доказательства</h5><div class="evl">${ev}</div>`:''}${x.files?`<div class="small" style="margin-top:6px">Вложений в сообщении: ${x.files}</div>`:''}
    ${th?`<h5>Тред · ${x.nReplies}${x.nReplies>x.replies.length&&!x.cut?' (показаны первые '+x.replies.length+')':''}</h5>${th}`:`<h5>Тред</h5><div class="small">Ответов в треде нет.</div>`}
    <a class="cta mm" href="${MM}${esc(QA.team||'blackhub')}/pl/${esc(x.id)}" target="_blank" rel="noopener">${ico('chat')}Открыть тред в Mattermost</a>${x.main?`<a class="cta jira" style="margin-left:10px" href="${JIRA}${encodeURIComponent(x.main.k)}" target="_blank" rel="noopener"><svg class="ji" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 11.5l-8.2 8.2a5.3 5.3 0 0 1-7.5-7.5l8.6-8.6a3.5 3.5 0 0 1 5 5l-8.6 8.6a1.8 1.8 0 0 1-2.5-2.5l7.9-7.9"/></svg>${esc(x.main.k)} в Jira</a>`:''}<button class="ghost" data-close="1">Закрыть</button>`);
}
function qaScrub(o){
  const E = /[\w.+-]+@[\w-]+(\.[\w-]+)+/g, f = s => typeof s==='string' ? s.replace(E,'[почта скрыта]') : s;
  (o.reports||[]).forEach(r=>{ ['short','raw','steps','cs','impact','reach','freq','device','when'].forEach(k=>{ if (r[k]) r[k]=f(r[k]); }); if (Array.isArray(r.replies)) r.replies = r.replies.map(m=>[m[0],m[1],f(m[2])]); });
  return o;
}
function isQaData(o){ return o && o.v==='qa1' && Array.isArray(o.reports); }
function applyQa(o){ QA = o; QCACHE = null; const y=window.scrollY; render(); window.scrollTo(0,y); }

/* ---------- sheet ---------- */
const sheet = document.getElementById('sheet'), ov = document.getElementById('ov');
const SX = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>';
let SHEET_HIST = false, BACK_PENDING = false, NAVQ = null;
function openSheet(html){
  const was = sheet.classList.contains('on');
  sheet.innerHTML = `<div class="shead"><div class="grab"></div><button class="sx" data-close="1" aria-label="Закрыть">${SX}</button></div><div class="sbody">${html}</div>`;
  sheet.style.transform = ''; sheet.classList.add('on'); ov.classList.add('on'); sheet.scrollTop=0;
  document.documentElement.classList.add('noscroll');
  if (!was && !SHEET_HIST){ try { history.pushState({sheet:1}, ''); SHEET_HIST = true; } catch(e){} }
}
function closeSheet(fromHistory){
  if (!sheet.classList.contains('on')) return;
  sheet.classList.remove('on'); ov.classList.remove('on'); sheet.style.transform = '';
  document.documentElement.classList.remove('noscroll');
  if (SHEET_HIST){ SHEET_HIST = false; if (fromHistory!==true){ BACK_PENDING = true; history.back(); } }
}
function setHash(h){ if (BACK_PENDING) NAVQ = ()=>{ location.hash = h; }; else location.hash = h; }
window.addEventListener('popstate', ()=>{
  if (BACK_PENDING){ BACK_PENDING = false; const f = NAVQ; NAVQ = null; if (f) f(); return; }
  if (sheet.classList.contains('on')) closeSheet(true);
});
/* смахивание вниз закрывает карточку */
(function(){
  let y0 = null, dy = 0, drag = false;
  sheet.addEventListener('touchstart', e=>{ const onHead = e.target.closest('.shead'); if (!onHead && sheet.scrollTop > 0) { y0 = null; return; } y0 = e.touches[0].clientY; dy = 0; drag = false; }, {passive:true});
  sheet.addEventListener('touchmove', e=>{ if (y0===null) return; dy = e.touches[0].clientY - y0; if (dy > 8){ drag = true; sheet.classList.add('drag'); sheet.style.transform = `translate(-50%, ${dy}px)`; } else if (dy < 0 && !drag) y0 = null; }, {passive:true});
  sheet.addEventListener('touchend', ()=>{ if (y0===null) return; sheet.classList.remove('drag'); if (drag && dy > 110) closeSheet(); else sheet.style.transform = ''; y0 = null; drag = false; });
})();
ov.addEventListener('click', closeSheet);
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeSheet(); });

function historyHtml(i){
  const ev = [];
  let n=0;
  i.tr.forEach((t,idx)=>ev.push({n:n++, d:t[0], kind:'st', from: idx>0 ? i.tr[idx-1][1] : null, to:t[1], who:t[2]}));
  i.dd.forEach(x=>ev.push({n:n++, d:x[0], kind:'due', from:x[1], to:x[2], who:x[3]}));
  ev.sort((a,b)=> a.d<b.d?1:a.d>b.d?-1:(b.n-a.n));
  ev.push({d:i.c, kind:'new'});
  return ev.map(e=>{
    if (e.kind==='new') return `<div><span class="dd">${dShort(e.d)}</span><span class="pp" style="background:var(--faint)"></span><span>Задача создана</span></div>`;
    if (e.kind==='due') {
      const txt = !e.from ? `Срок назначен: <b>${dLong(e.to)}</b>` : !e.to ? `Срок снят (был ${dLong(e.from)})` : `Срок перенесён: ${dLong(e.from)} → <b>${dLong(e.to)}</b>`;
      return `<div class="due"><span class="dd">${dShort(e.d)}</span><span class="pp" style="background:var(--c-wip);border-radius:3px"></span><span>${txt}${e.who?` <span class="w">· ${esc(e.who)}</span>`:''}</span></div>`;
    }
    return `<div><span class="dd">${dShort(e.d)}</span><span class="pp" style="background:${SC[stageOf(e.to)]}"></span><span>${e.from?`<span class="w">${esc(ru(e.from))} →</span> `:''}${esc(ru(e.to))}${e.who?` <span class="w">· ${esc(e.who)}</span>`:''}</span></div>`;
  }).join('');
}

  openSheet(`

    <h2>${esc(i.title)}</h2>
    <div class="meta">
      ${box('Статус в Jira', esc(ru(i.st)))}
      ${box('Исполнитель', esc(i.who||'Не назначен'))}
      ${box('Отдел', deptChip(i.dept))}
      ${i.isQa ? box('Передано из MM', esc(qaPassedBy(i)||'—')) : ''}
      ${box('Приоритет', esc(PRIO_RU[i.p]||i.p||''))}
      ${box('Тип', esc(TYPE_RU[i.t]||i.t))}
      ${box('Создана', dLong(i.c))}
      ${i.stage==='done' ? box('Завершено в Jira', dLong(i.doneAt), 'ok') : box('В текущем этапе с', dLong(i.since))}

      ${i.fv.length ? box(i.fv.length>1?'Релизы':'Релиз', i.fv.map(v=>esc(v[0])+(v[1]?` <span class="dept">· ${dShort(v[1])}</span>`:'')).join('<br>')) : ''}
      ${i.e ? `<div style="grid-column:1/-1"><span>Эпик</span><b>${esc(i.e)}${epic?' · '+esc(epic):''}</b></div>` : ''}
    </div>
    <h5>Кратко</h5><div class="txt">${esc(i.sd || 'Описание в задаче не заполнено.')}${(i.desc||'').length>=395?'…':''}</div>
    ${i.deps.length?`<h5>Зависит от</h5>${i.deps.map(d=>`<div class="lk" data-open="${esc(d.k)}"><span class="t">${esc(linkLabel(d.t))}</span><span class="s"><b>${esc(d.k)}</b>${esc(cleanTitle(d.s))}</span><span class="pill" style="--c:${SC[stageOf(d.st,d.sc)]}">${esc(ru(d.st))}</span></div>`).join('')}`:''}
    ${links?`<h5>Связи в Jira · ${i.ln.length}</h5>${links}`:''}
    ${(()=>{ const ks = [i.k, ...(i.aka||[])]; const reps = qaReports().filter(x=>(x.keys||[]).some(k=>ks.includes(k))); return reps.length ? `<h5>Заявки из QA: Bugs · ${reps.length}</h5>`+reps.map(x=>`<div class="lk" data-qa="${esc(x.id)}"><span class="t">${dShort(x.d)}</span><span class="s">${esc(x.title)}</span>${staffChip(x.u)}${qsPill(x)}</div>`).join('') : ''; })()}
    ${cms?`<h5>Комментарии · ${i.cm.length}</h5>${cms}`:''}

}, 180000);

/* ---------- publish ---------- */
function readPaste(){
  const txt = (document.getElementById('pasteBox').value||'').trim();
  if (!txt) { setMsg('Сначала вставьте данные из закладки.','err'); return null; }
  let obj; try { obj = JSON.parse(txt); } catch(e){ setMsg('Не похоже на данные из закладки — вставьте текст целиком.','err'); return null; }
  if (isQaData(obj)){ if (!obj.reports.length){ setMsg('В данных из Mattermost нет заявок.','err'); return null; } return qaScrub(obj); }
  if (!obj || !(obj.v===1||obj.v===2) || !Array.isArray(obj.issues) || !obj.issues.length || !obj.issues[0].k){ setMsg('В данных нет задач — проверьте, что скопировали вывод закладки.','err'); return null; }
  return scrub(obj);
}
function saveGhClick(){ const c = readGh(); if (!c.token || !c.owner || !c.repo) return setMsg('Заполните токен, логин и репозиторий.','err'); openSync(); setMsg('Сохранено. Теперь перетащите обе закладки на панель закладок (старые удалите).','ok'); }
function readGh(){
  const g = id => (document.getElementById(id)||{}).value||'';
  const c = Object.assign(ghCfg(), {token:g('ghToken').trim(), owner:g('ghOwner').trim(), repo:g('ghRepo').trim(), branch:(g('ghBranch').trim()||'main')});
  saveGh(c); return c;
}
function b64(bytes){ let s=''; const ch=0x8000; for (let i=0;i<bytes.length;i+=ch) s += String.fromCharCode.apply(null, bytes.subarray(i,i+ch)); return btoa(s); }
async function publishGh(text, c, at, file){
  file = file || DATA_FILE;
  const api = `https://api.github.com/repos/${encodeURIComponent(c.owner)}/${encodeURIComponent(c.repo)}/contents/${file}`;
  const H = {'Authorization':'Bearer '+c.token, 'Accept':'application/vnd.github+json', 'X-GitHub-Api-Version':'2022-11-28'};
  let sha;
  const g = await fetch(api+'?ref='+encodeURIComponent(c.branch), {headers:H, cache:'no-store'});
  if (g.ok) sha = (await g.json()).sha;
  else if (g.status!==404) throw new Error(ghErr(g.status));
  const p = await fetch(api, {method:'PUT', headers:Object.assign({'Content-Type':'application/json'},H), body:JSON.stringify({message:(file===QA_FILE?'Обновление багов из QA · ':'Обновление данных Jira · ')+at, content:b64(te.encode(text)), branch:c.branch, sha})});
  if (!p.ok) throw new Error(ghErr(p.status));
}
function ghErr(s){
  return ({401:'GitHub не принял токен (401). Проверьте, что токен скопирован целиком и не истёк.',403:'Токену не хватает прав (403). Нужно право Contents: Read and write на этот репозиторий.',404:'Репозиторий не найден (404). Проверьте логин и название репозитория, и что токен выдан на этот репозиторий.',409:'Конфликт версий (409). Нажмите «Опубликовать» ещё раз.',422:'GitHub отклонил файл (422). Попробуйте ещё раз.'})[s] || ('Ошибка GitHub: HTTP '+s);
}
async function doPublish(){
  const obj = readPaste(); if (!obj) return;
  const c = readGh();
  if (!c.token || !c.owner || !c.repo) return setMsg('Заполните настройки GitHub: токен, логин и репозиторий.','err');
  setMsg('Публикую…');
  if (isQaData(obj)){
    try {
      await publishGh(JSON.stringify(obj), c, obj.at||'', QA_FILE);
      QA_AT = obj.at||''; applyQa(obj);
      document.getElementById('pasteBox').value = '';
      setMsg(`Готово: ${obj.reports.length} заявок из QA опубликовано. Теперь обновите данные из Jira (закладка «Sync CS-409»), чтобы подтянулись статусы задач BR-…`,'ok');
    } catch(e){ setMsg(e.message||String(e),'err'); }
    return;
  }
  try {
    await publishGh(JSON.stringify(obj), c, obj.at||'');
    ENV_AT = obj.at||''; applyData(obj);
    document.getElementById('pasteBox').value = '';
    setMsg(`Готово: ${obj.issues.length} задач${obj.qa?` и ${obj.qa.issues.length} задач из QA`:''} опубликовано. У остальных обновится в течение пары минут.`,'ok');
  } catch(e){ setMsg(e.message||String(e),'err'); }
}
function doDownload(){
  const obj = readPaste(); if (!obj) return;
  const isQ = isQaData(obj), fn = isQ ? QA_FILE : DATA_FILE;
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(obj)], {type:'application/json'}));
  a.download = fn; document.body.appendChild(a); a.click(); a.remove();
  isQ ? applyQa(obj) : applyData(obj);
  setMsg('Файл '+fn+' скачан. Загрузите его в репозиторий на GitHub (Add file → Upload files) с заменой старого.','ok');
}
function applyData(raw){ RAW = raw; DATA = normalize(raw); const y=window.scrollY; render(); window.scrollTo(0,y); }
function lockOut(){}

boot();

</script>
